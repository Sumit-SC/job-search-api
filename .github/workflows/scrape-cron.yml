name: Trigger Scheduled Job Scrape

on:
  schedule:
    # Run every 4 hours (at minute 0 of every 4th hour: 0, 4, 8, 12, 16, 20 UTC)
    - cron: '0 */4 * * *'
  workflow_dispatch:
    # Allows manual triggering from the GitHub Actions UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Refresh Endpoint
        run: |
          echo "Triggering scraper refresh..."
          curl -i --connect-timeout 60 --max-time 600 -X POST "https://job-search-api-w042.onrender.com/refresh"
